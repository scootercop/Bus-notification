# .github/workflows/bus_notifier.yml
#
# Runs the bus 712 arrival checker every 5 minutes between 7:20–8:00 AM
# Auckland time, on Wednesday, Thursday, and Friday.
#
# NOTE: GitHub Actions scheduled workflows have a minimum interval of 5 minutes.
# Actual runs may be delayed by several minutes during peak periods.
#
# Setup:
#   1. Add AT_API_KEY to repo Settings → Secrets → Actions
#   2. Add NTFY_TOPIC to repo Settings → Secrets → Actions
#   3. Install the Ntfy app on your phone and subscribe to your NTFY_TOPIC

name: Bus 712 Notifier

on:
  schedule:
    # Every 5 minutes from 7:20–8:00 AM Auckland time on Wed/Thu/Fri.
    # Auckland time auto-handles daylight saving when timezone is set.
    - cron: '20,25,30,35,40,45,50,55 7 * * 3,4,5'
      timezone: 'Pacific/Auckland'
    - cron: '0 8 * * 3,4,5'
      timezone: 'Pacific/Auckland'

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  check-bus:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run bus checker
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_bus.py

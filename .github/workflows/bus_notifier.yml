# .github/workflows/bus_notifier.yml
#
# Runs the bus 712 arrival checker every minute between 7:20–8:00 AM NZST
# on Wednesday, Thursday, and Friday.
#
# NZ Standard Time is UTC+12, so 7:20–8:00 NZST = 19:20–20:00 UTC (prev day).
# GitHub Actions cron uses UTC. Wed/Thu/Fri NZST = Tue/Wed/Thu UTC.
#
# Setup steps:
#   1. Add AT_API_KEY to your repo → Settings → Secrets → Actions
#   2. Add NTFY_TOPIC to your repo → Settings → Secrets → Actions
#   3. Install the Ntfy app on your phone and subscribe to your NTFY_TOPIC

name: Bus 712 Notifier

on:
  schedule:
    # Every minute from 19:20 to 19:59 UTC (= 7:20–8:00 NZST)
    # on Tuesday, Wednesday, Thursday (= Wed, Thu, Fri NZST)
    - cron: '20-59 19 * * 2,3,4'   # 7:20–7:59 NZST
    - cron: '0    20 * * 2,3,4'    # 8:00 NZST (last run)

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  check-bus:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run bus checker
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_bus.py

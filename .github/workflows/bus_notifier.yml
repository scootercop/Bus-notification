# .github/workflows/bus_notifier.yml
#
# TEST MODE: Runs every minute, 24/7.
# NOTE: GitHub Actions cron is best-effort - actual runs may be every 5-15 minutes.
#
# Setup steps:
#   1. Add AT_API_KEY to your repo → Settings → Secrets → Actions
#   2. Add NTFY_TOPIC to your repo → Settings → Secrets → Actions
#   3. Install the Ntfy app on your phone and subscribe to your NTFY_TOPIC

name: Bus 712 Notifier

on:
  schedule:
    - cron: '* * * * *'   # every minute (best effort)

  # Allow manual triggering for testing
  workflow_dispatch:

jobs:
  check-bus:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run bus checker
        env:
          AT_API_KEY: ${{ secrets.AT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_bus.py
